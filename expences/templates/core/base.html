{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traveler Expenses Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #1e293b;
            position: fixed;
            left: 0;
            top: 0;
            color: white;
        }

        .sidebar h3 {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #334155;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            padding: 15px 20px;
        }

        .sidebar ul li:hover {
            background: #334155;
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
            display: block;
        }

        /* Topbar */
        .topbar {
            margin-left: 250px;
            height: 70px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .topbar h2 {
            margin: 0;
            color: #1e293b;
        }

        /* Content */
        .content {
            margin-left: 250px;
            padding: 30px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Traveler Expenses Tracker</h3>

        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Trips</a></li>
            <li><a href="#">Expenses</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">Companions</a></li>
            <li><a href="#">Reports</a></li>
            <li><a href="#">Logout</a></li>
        </ul>
    </div>

    <!-- Topbar -->
    <div class="topbar">
        <h2>Traveler Expenses Tracker</h2>
    </div>

    <!-- Main Content -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
